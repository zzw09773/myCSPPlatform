upstream csp_backend {
    server csp:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # ─────────────────────────────────────────────
    # CSP 管理平台（前端 + API）
    # ─────────────────────────────────────────────
    location / {
        proxy_pass http://csp_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support for proxy endpoints
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ─────────────────────────────────────────────
    # 模型端點反向代理
    # 透過 /models/<name>/ 存取內部模型服務
    # ─────────────────────────────────────────────

    # LLM (vLLM)
    location /models/llama3-70b/ {
        proxy_pass http://vllm-llm:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # VLM (vLLM)
    # location /models/qwen2-vl/ {
    #     proxy_pass http://vllm-vlm:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_buffering off;
    #     proxy_read_timeout 300s;
    # }

    # Embedding (Triton)
    location /models/nv-embed-v2/ {
        proxy_pass http://triton-embedding:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

