services:
  # ============================================================
  # Nginx 反向代理（統一入口）
  # ============================================================
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      # 如需 HTTPS，取消下行註解並掛載憑證
      # - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 憑證（選用）
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - csp
    restart: unless-stopped

  # ============================================================
  # CSP Platform - 管理平台
  # ============================================================
  csp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # 透過 nginx 存取，不需對外暴露 port
    # 如需直連後端可取消下行註解
    # ports:
    #   - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    env_file:
      - ../.env
    restart: unless-stopped
    # depends_on:
    #   - vllm-llm
    #   - triton-embedding

  # ============================================================
